services:
  db:
    image: postgres:16-alpine
    container_name: aip_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aip_db}
      POSTGRES_USER: ${POSTGRES_USER:-aip_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aip_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-aip_user} -d ${POSTGRES_DB:-aip_db}']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aip_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aip_user}:${POSTGRES_PASSWORD:-aip_pass}@db:5432/${POSTGRES_DB:-aip_db}
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkey_changeme_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PORT: 4000
      UPLOAD_DIR: /app/uploads
      AI_SERVICE_URL: http://ai-service:8000
    volumes:
      - ./uploads:/app/uploads
    ports:
      - '4000:4000'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:4000
    container_name: aip_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '5173:80'

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: aip_ai_service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aip_user}:${POSTGRES_PASSWORD:-aip_pass}@db:5432/${POSTGRES_DB:-aip_db}
    ports:
      - '8000:8000'

volumes:
  pgdata: